<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics • Worthy Waste</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="logo">Worthy Waste</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="supplier.html">Supplier</a>
        <a href="buyer.html">Buyer</a>
        <a href="analytics.html">Analytics</a>
        <a href="admin.html">Admin</a>
      </nav>
      </nav>
    </div>
  </header>

  <main class="container" style="padding:24px 0;">
    <h1>Analytics</h1>
    <p class="small">Overview of waste saved, compost generated, CO₂ saved, and top contributors.</p>

    <section class="grid grid-3" style="margin-top:12px;">
      <div class="card">
        <div class="counter-value" id="aWasteSaved">0 kg</div>
        <div class="counter-label">Waste Saved</div>
      </div>
      <div class="card">
        <div class="counter-value" id="aCompostProduced">0 kg</div>
        <div class="counter-label">Compost Produced</div>
      </div>
      <div class="card">
        <div class="counter-value" id="aCo2Reduced">0 kg</div>
        <div class="counter-label">CO₂ Reduced</div>
      </div>
    </section>

    <section class="grid grid-2" style="margin-top:16px;">
      <div class="card">
        <h3>Status Breakdown</h3>
        <div id="statusChart"></div>
      </div>
      <div class="card">
        <h3>Leaderboard</h3>
        <ol id="leaderboard"></ol>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">© <span id="year"></span> Worthy Waste</div>
  </footer>

  <script src="nav.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('year').textContent = new Date().getFullYear();
      initAnalyticsPage();
    });
  </script>
</body>
</html>
